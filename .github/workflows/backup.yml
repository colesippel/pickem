name: Weekly backup

on:
  schedule:
    - cron: '0 12 * * 2'   # Tuesdays 12:00 UTC (about 6-7 AM Central)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the database
        run: |
          mkdir -p backups
          curl -fsS "https://sip-lines-pickem-default-rtdb.firebaseio.com/.json" -o "backups/pickem-backup-$(date -u +%Y-%m-%d).json"

      - name: Save the backup to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add backups
          git commit -m "Weekly backup" || echo "Nothing new to commit"
          git push
