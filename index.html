<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sip & Linds Pick'em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1A;
    --surface:#121A2E;
    --surface2:#1B2540;
    --border:#2A3554;
    --text:#F4F6FA;
    --text-dim:#8792AC;
    --accent:#E4002B;
    --accent-text:#FFFFFF;
    --gold:#C9A227;
    --gold-text:#141008;
    --win:#2E8B57;
    --loss:#E4002B;
    --locked:#6B7591;
    --f-display:'Anton', Impact, "Arial Narrow Bold", sans-serif;
    --f-condensed:'Oswald', -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  header.top{
    position:relative;
    top:0;z-index:10;
    background:
      repeating-linear-gradient(120deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 34px),
      linear-gradient(180deg, #0D1326 0%, var(--bg) 100%);
    padding:16px 16px 0 16px;
  }
  header.top::after{
    content:'';display:block;height:5px;margin-top:12px;
    background:linear-gradient(90deg, var(--accent) 0%, var(--accent) 70%, var(--gold) 70%, var(--gold) 100%);
    clip-path:polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  }
  h1{
    font-family:var(--f-display);
    font-size:26px;font-weight:400;letter-spacing:0.01em;margin:0 0 14px 0;
    text-transform:uppercase;color:var(--text);
  }
  .tabs{display:flex;gap:2px;position:sticky;top:0;background:var(--bg);z-index:10;}
  .tab{
    flex:1;text-align:center;padding:10px 4px 12px 4px;
    font-family:var(--f-condensed);font-size:14px;font-weight:600;letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text-dim);background:none;border:none;border-bottom:3px solid var(--border);
    cursor:pointer;
  }
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}

  main{flex:1;padding:16px;padding-bottom:48px;}

  .weekrow{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 8px 0;margin-bottom:16px;}
  .weekchip{
    flex:0 0 auto;padding:8px 16px 8px 12px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-dim);
    font-family:var(--f-condensed);font-size:13px;font-weight:600;letter-spacing:0.03em;
    text-transform:uppercase;cursor:pointer;white-space:nowrap;
    clip-path:polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .weekchip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  select.whoami{
    width:100%;padding:12px;border-radius:6px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:15px;font-weight:600;margin-bottom:16px;
    -webkit-appearance:none;appearance:none;
  }

  .lockrow{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--border);border-radius:6px;
    padding:12px 14px;margin:0 0 16px 0;
  }
  .locklabel{
    font-family:var(--f-condensed);font-size:13px;font-weight:600;letter-spacing:0.03em;
    text-transform:uppercase;color:var(--text);
  }
  .switch{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .sliderctl{
    position:absolute;cursor:pointer;inset:0;background:var(--surface2);
    border:1px solid var(--border);border-radius:14px;transition:0.15s;
  }
  .sliderctl::before{
    content:'';position:absolute;height:18px;width:18px;left:3px;top:3px;
    background:var(--text-dim);border-radius:50%;transition:0.15s;
  }
  .switch input:checked + .sliderctl{background:var(--accent);border-color:var(--accent);}
  .switch input:checked + .sliderctl::before{transform:translateX(20px);background:#fff;}

  .card{
    background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);
    border-radius:4px;padding:14px;margin-bottom:12px;
  }
  .card.card-locked{border-left-color:var(--accent);}
  .card.card-final{border-left-color:var(--gold);}
  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;}
  .kickoff{font-family:var(--f-condensed);font-size:12px;color:var(--text-dim);font-weight:500;letter-spacing:0.02em;}
  .status{
    font-family:var(--f-condensed);font-size:11px;font-weight:700;letter-spacing:0.05em;
    text-transform:uppercase;padding:3px 12px 3px 9px;white-space:nowrap;
    clip-path:polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  }
  .status.open{color:var(--text-dim);background:var(--surface2);}
  .status.locked{color:#fff;background:var(--accent);}
  .status.final{color:var(--gold-text);background:var(--gold);}

  .matchup{display:flex;gap:8px;}
  .teambtn{
    flex:1;padding:14px 6px;border-radius:5px;border:1.5px solid var(--border);
    background:var(--surface2);color:var(--text);
    font-family:var(--f-display);font-size:16px;font-weight:400;letter-spacing:0.01em;
    text-transform:uppercase;cursor:pointer;text-align:center;line-height:1.25;
  }
  .teambtn .at{
    display:inline-block;font-family:var(--f-condensed);font-size:9px;font-weight:700;
    letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);
    background:rgba(135,146,172,0.14);padding:2px 8px;border-radius:2px;margin-bottom:6px;
  }
  .teambtn .teamlogo{display:block;width:32px;height:32px;object-fit:contain;margin:0 auto 6px auto;}
  .teambtn .teamrecord{
    display:block;font-family:var(--f-condensed);font-size:10px;font-weight:500;
    color:var(--text-dim);margin-top:2px;letter-spacing:0.02em;
  }
  .teambtn .spreadline{
    display:block;font-family:var(--f-condensed);font-size:11px;font-weight:600;
    color:var(--text-dim);margin-top:5px;letter-spacing:0.02em;
  }
  .teambtn.picked{border-color:var(--gold);background:rgba(201,162,39,0.14);}
  .teambtn.picked .at{background:rgba(201,162,39,0.25);color:var(--gold);}
  .teambtn.winner{border-color:var(--win);background:rgba(46,139,87,0.16);}
  .teambtn .scoreline{
    display:block;font-family:var(--f-display);font-size:18px;color:var(--text-dim);
    margin-top:5px;letter-spacing:0.01em;
  }
  .teambtn.winner .scoreline{color:var(--win);}
  .teambtn.disabled{opacity:0.5;cursor:default;}

  .progressrow{
    background:var(--surface);border:1px solid var(--border);border-radius:6px;
    padding:12px 14px;margin-bottom:16px;
  }
  .progresshead{
    font-family:var(--f-condensed);font-size:12px;font-weight:600;letter-spacing:0.03em;
    text-transform:uppercase;color:var(--text-dim);margin-bottom:9px;
  }
  .progresschips{display:flex;flex-wrap:wrap;gap:6px;}
  .progresschip{
    font-family:var(--f-condensed);font-size:11px;font-weight:600;letter-spacing:0.02em;
    padding:4px 9px;border-radius:3px;border:1px solid var(--border);color:var(--text-dim);
  }
  .progresschip.partial{border-color:var(--gold);color:var(--gold);}
  .progresschip.done{background:rgba(46,139,87,0.18);border-color:var(--win);color:var(--win);}

  .subrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--text-dim);flex-wrap:wrap;gap:6px;}
  .tag{
    font-family:var(--f-condensed);padding:3px 10px;font-weight:700;font-size:11px;
    letter-spacing:0.04em;text-transform:uppercase;
    clip-path:polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
  }
  .tag.correct{background:rgba(46,139,87,0.22);color:var(--win);}
  .tag.incorrect{background:rgba(228,0,43,0.18);color:var(--loss);}
  .tag.nopick{background:rgba(228,0,43,0.18);color:var(--loss);}

  .empty{color:var(--text-dim);font-size:14px;text-align:center;padding:40px 16px;}

  table.standings{width:100%;border-collapse:collapse;}
  table.standings th{
    text-align:left;font-family:var(--f-condensed);font-size:11px;color:var(--text-dim);
    font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
    padding:0 8px 8px 8px;border-bottom:2px solid var(--accent);
  }
  table.standings td{padding:13px 8px;border-bottom:1px solid var(--border);font-size:14px;}
  table.standings tr:last-child td{border-bottom:none;}
  .rank{font-family:var(--f-display);font-size:20px;color:var(--text-dim);width:28px;}
  table.standings tr:nth-child(1) .rank{color:var(--gold);}
  table.standings tr:nth-child(2) .rank{color:#C7CBD6;}
  table.standings tr:nth-child(3) .rank{color:#C87D3B;}
  .pname{font-family:var(--f-condensed);font-weight:600;letter-spacing:0.01em;}
  .rec{text-align:right;font-family:var(--f-display);font-size:17px;color:var(--text);font-variant-numeric:tabular-nums;}
  .pct{text-align:right;color:var(--text-dim);font-size:12px;font-family:var(--f-condensed);}

  section.admin-block{margin-bottom:24px;}
  section.admin-block h2{
    font-family:var(--f-condensed);font-size:14px;font-weight:700;letter-spacing:0.04em;
    text-transform:uppercase;margin:0 0 10px 0;color:var(--text);
    border-left:3px solid var(--accent);padding-left:9px;
  }
  .prow{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .prow input[type=text]{
    flex:1;padding:10px;border-radius:6px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text);font-size:14px;
  }
  .grow{
    background:var(--surface);border:1px solid var(--border);border-radius:6px;
    padding:10px;margin-bottom:8px;
  }
  .grow-fields{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .grow input[type=text]{
    flex:1 1 90px;padding:8px;border-radius:5px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text);font-size:13px;min-width:80px;
  }
  .grow input[type=datetime-local]{
    flex:1 1 150px;padding:8px;border-radius:5px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text);font-size:13px;
  }
  .grow select{
    padding:8px;border-radius:5px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text);font-size:13px;
  }
  .iconbtn{
    background:none;border:none;color:var(--loss);font-size:18px;cursor:pointer;padding:4px 8px;
  }
  .btn{
    display:inline-block;padding:11px 18px;border-radius:5px;border:none;
    background:var(--accent);color:#fff;
    font-family:var(--f-condensed);font-weight:700;font-size:14px;letter-spacing:0.03em;
    text-transform:uppercase;cursor:pointer;
  }
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .hint{font-size:12px;color:var(--text-dim);margin:-4px 0 12px 0;line-height:1.5;}
  .saved-msg{
    font-family:var(--f-condensed);font-size:12px;color:var(--win);font-weight:700;
    letter-spacing:0.03em;text-transform:uppercase;margin-left:8px;
  }
</style>
</head>

// 2026-11-01 DST fallback (EDT before, EST from Nov 1 on through the rest of the season).
function et(dateStr, timeStr){
  const d = new Date(dateStr+'T00:00:00Z');
  const dstEnd = new Date('2026-11-01T00:00:00Z');
  const offset = d < dstEnd ? '-04:00' : '-05:00';
  return dateStr+'T'+timeStr+':00'+offset;
}

function buildSeasonGames(){
  const out = {};
  Object.keys(SEASON_SCHEDULE).forEach(week=>{
    out[week] = SEASON_SCHEDULE[week].map((g,i)=>({
      id:'w'+week+'g'+(i+1), away:g[0], home:g[1], kickoff: et(g[2],g[3]), winner:null, tbd: !!g[4]
    }));
  });
  return out;
}

const FIREBASE_URL = 'https://sip-lines-pickem-default-rtdb.firebaseio.com';

// Translates our existing key names (e.g. 'games-week-3', 'picks-week-3-p2') into
// Firebase Realtime Database paths (e.g. 'games/week3', 'picks/week3/p2'), so the
// rest of the app didn't need to change when we moved off Claude's built-in storage.
function toPath(key){
  let m;
  if(key === 'players') return 'players';
  if(key === 'weeks') return 'weeks';
  if(m = key.match(/^games-week-(\d+)$/)) return 'games/week'+m[1];
  // Single field within one player's picks for a week (e.g. one game's pick, or their
  // lock flag) -- checked before the whole-player pattern below so a write here only
  // ever touches that one field and can never clobber a sibling.
  if(m = key.match(/^picks-week-(\d+)-([^-]+)-(.+)$/)) return 'picks/week'+m[1]+'/'+m[2]+'/'+m[3];
  if(m = key.match(/^picks-week-(\d+)-(.+)$/)) return 'picks/week'+m[1]+'/'+m[2];
  if(m = key.match(/^picks-week-(\d+)$/)) return 'picks/week'+m[1];
  return key;
}

async function storageGet(key){
  try{
    const res = await fetch(FIREBASE_URL+'/'+toPath(key)+'.json');
    if(!res.ok) return null;
    const data = await res.json();
    return data===null ? null : data;
  }catch(e){ return null; }
}
async function storageSet(key, val){
  try{
    const res = await fetch(FIREBASE_URL+'/'+toPath(key)+'.json', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(val)
    });
    return res.ok;
  }catch(e){ return false; }
}

// Weeks 1-18 are the regular season (ESPN seasontype=2, week numbers 1-18 directly).
// Weeks 19-22 are our postseason slots (Wild Card, Divisional, Conference, Super Bowl),
// which ESPN addresses as seasontype=3 with its own week numbering 1-4.
function espnParamsForWeek(week){
  return week <= 18 ? {seasontype:2, apiWeek:week} : {seasontype:3, apiWeek:week-18};
}

// Pulls final scores for one week from ESPN's public scoreboard feed and fills in any
// game winner that isn't set yet. Matches games by team nickname (e.g. "Chiefs"), which
// is how ESPN's shortDisplayName lines up with the names used throughout this app.
async function fetchEspnScoreboard(week){
  const {seasontype, apiWeek} = espnParamsForWeek(week);
  const target = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype='+seasontype+'&week='+apiWeek;
  // Try fetching ESPN directly first.
  try{
    const res = await fetch(target);
    if(res.ok) return await res.json();
  }catch(e){ /* likely blocked by CORS from this origin -- fall through to proxy */ }
  // Fallback: ESPN's endpoint doesn't always send the header a browser needs to read
  // a cross-origin response, so route through a public, no-signup CORS proxy instead.
  try{
    const proxied = 'https://api.allorigins.win/raw?url='+encodeURIComponent(target);
    const res2 = await fetch(proxied);
    if(!res2.ok) return null;
    return await res2.json();
  }catch(e){ return null; }
}

// Pulls both the current point spread and (once final) the winner for one week from
// ESPN's public scoreboard feed, in a single request. Matches games by team nickname
// (e.g. "Chiefs"), which is how ESPN's shortDisplayName lines up with the names used
// throughout this app. Spread is stored as {home:'-3.5', away:'+3.5'} straight off
// ESPN's own point-spread line, so it always reads correctly for whichever side it's
// shown next to.
async function syncWeekFromEspn(week){
  const data = await fetchEspnScoreboard(week);
  if(!data || !data.events) return false;
  const games = state.games[week] || [];
  let changed = false;
  data.events.forEach(ev=>{
    const comp = ev.competitions && ev.competitions[0];
    if(!comp) return;
    const home = comp.competitors.find(c=>c.homeAway==='home');
    const away = comp.competitors.find(c=>c.homeAway==='away');
    if(!home || !away) return;
    const g = games.find(g=> g.home===home.team.shortDisplayName && g.away===away.team.shortDisplayName);
    if(!g) return;

    const homeRec = home.records && home.records.find(r=>r.name==='overall');
    const awayRec = away.records && away.records.find(r=>r.name==='overall');
    if(homeRec && awayRec && (!g.records || g.records.home!==homeRec.summary || g.records.away!==awayRec.summary)){
      g.records = {home:homeRec.summary, away:awayRec.summary};
      changed = true;
    }

    const oddsEntry = comp.odds && comp.odds[0];
    const ps = oddsEntry && oddsEntry.pointSpread;
    const homeLine = ps && ps.home && ps.home.close && ps.home.close.line;
    const awayLine = ps && ps.away && ps.away.close && ps.away.close.line;
    if(homeLine && awayLine && (!g.spread || g.spread.home!==homeLine || g.spread.away!==awayLine)){
      g.spread = {home:homeLine, away:awayLine};
      changed = true;
    }
    const total = oddsEntry && oddsEntry.overUnder;
    if(total && g.total !== total){
      g.total = total;
      changed = true;
    }

    const status = comp.status && comp.status.type;
    if(status && status.completed){
      const homeScore = parseInt(home.score, 10);
      const awayScore = parseInt(away.score, 10);
      if(!isNaN(homeScore) && !isNaN(awayScore)){
        if(!g.score || g.score.home!==homeScore || g.score.away!==awayScore){
          g.score = {home:homeScore, away:awayScore};
          changed = true;
        }
        if(homeScore !== awayScore){
          const winnerSide = homeScore>awayScore ? 'home' : 'away';
          if(g.winner !== winnerSide){
            g.winner = winnerSide;
            changed = true;
          }
        }
      }
    }
  });
  if(changed){
    await storageSet('games-week-'+week, games);
    state.games[week] = games;
  }
  return changed;
}

// Keeps the currently-viewed week's spreads current, and grades any started-but-
// ungraded game in any week. Safe to call often -- reads are cheap and writes only
// happen when something actually changed.
// Pulls the actual matchups for a postseason round (teams + kickoff time) from ESPN,
// once that round's bracket has been set. Returns false with a banner message if
// ESPN doesn't have anything yet (e.g. the previous round hasn't finished).
async function pullPlayoffMatchups(week){
  const data = await fetchEspnScoreboard(week);
  if(!data || !data.events || data.events.length===0){
    flashBanner('No matchups from ESPN yet — check back once the bracket is set', true);
    return false;
  }
  const games = data.events.map((ev, i)=>{
    const comp = ev.competitions && ev.competitions[0];
    const home = comp.competitors.find(c=>c.homeAway==='home');
    const away = comp.competitors.find(c=>c.homeAway==='away');
    return {
      id: 'w'+week+'g'+(i+1),
      away: away.team.shortDisplayName,
      home: home.team.shortDisplayName,
      kickoff: ev.date,
      winner: null,
      tbd: false
    };
  });
  state.games[week] = games;
  await storageSet('games-week-'+week, games);
  flashBanner(games.length+' matchup'+(games.length===1?'':'s')+' pulled in', false);
  return true;
}

async function syncStaleAndActiveWeeks(){
  const now = Date.now();
  let anyChanged = false;
  if(state.activeWeek){
    const changed = await syncWeekFromEspn(state.activeWeek);
    if(changed) anyChanged = true;
  }
  for(const w of state.weeks){
    if(w === state.activeWeek) continue;
    if(!state.games[w]) state.games[w] = await storageGet('games-week-'+w) || [];
    const games = state.games[w];
    const hasStale = games.some(g=> !g.winner && new Date(g.kickoff).getTime() <= now);
    if(!hasStale) continue;
    const changed = await syncWeekFromEspn(w);
    if(changed) anyChanged = true;
  }
  if(anyChanged) render();
  return anyChanged;
}

async function init(){
  let players = await storageGet('players', true);
  if(!players){ players = DEFAULT_PLAYERS; await storageSet('players', players, true); }
  state.players = players;

  let weeks = await storageGet('weeks', true);
  if(!weeks){
    const seasonGames = buildSeasonGames();
    weeks = Object.keys(seasonGames).map(Number).sort((a,b)=>a-b);
    weeks = weeks.concat([19,20,21,22]);
    await storageSet('weeks', weeks, true);
    for(const w of Object.keys(seasonGames)){
      await storageSet('games-week-'+w, seasonGames[w], true);
      state.games[w] = seasonGames[w];
    }
    for(const w of [19,20,21,22]){
      await storageSet('games-week-'+w, [], true);
      state.games[w] = [];
    }
  } else {
    // Migration for pools created before the postseason weeks existed -- add them
    // without touching anything already stored.
    const missing = [19,20,21,22].filter(w=>!weeks.includes(w));
    if(missing.length){
      weeks = weeks.concat(missing);
      await storageSet('weeks', weeks);
      for(const w of missing){
        await storageSet('games-week-'+w, []);
        state.games[w] = [];
      }
    }
  }
  state.weeks = weeks.sort((a,b)=>a-b);

  state.activeWeek = await guessCurrentWeek();
  state.adminWeek = state.activeWeek;
  await loadWeek(state.activeWeek);
  state.loaded = true;
  render();
}

async function loadWeek(week){
  if(!state.games[week]){
    state.games[week] = await storageGet('games-week-'+week) || [];
  }
  if(!state.picks[week]){
    state.picks[week] = await storageGet('picks-week-'+week) || {};
  }
}

async function guessCurrentWeek(){
  const now = Date.now();
  let current = state.weeks[0];
  for(const w of state.weeks){
    if(!state.games[w]) state.games[w] = await storageGet('games-week-'+w, true) || [];
    const games = state.games[w];
    if(games.length===0) continue;
    const minKick = Math.min(...games.map(g=>new Date(g.kickoff).getTime()));
    if(minKick <= now) current = w; else break;
  }
  return current;
}

async function ensureAllWeeksLoaded(){
  for(const w of state.weeks){ await loadWeek(w); }
}

function fmtKickoff(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-US', {weekday:'short', hour:'numeric', minute:'2-digit'});
}
function fmtLockRemaining(iso){
  const diff = new Date(iso).getTime() - Date.now();
  if(diff<=0) return null;
  const mins = Math.floor(diff/60000);
  const days = Math.floor(mins/1440);
  const hrs = Math.floor((mins%1440)/60);
  const m = mins%60;
  if(days>=1) return days+'d '+hrs+'h';
  if(hrs>=1) return hrs+'h '+m+'m';
  return m+'m';
}
function isLocked(game){
  return new Date(game.kickoff).getTime() <= Date.now();
}

async function setPick(week, playerId, gameId, side){
  const game = (state.games[week]||[]).find(g=>g.id===gameId);
  const myPicks = (state.picks[week]||{})[playerId];
  const isLockedForPlayer = !(myPicks && myPicks._locked === false);
  if(!game || isLocked(game) || isLockedForPlayer) { render(); return; }
  if(!state.picks[week]) state.picks[week] = {};
  if(!state.picks[week][playerId]) state.picks[week][playerId] = {};
  const current = state.picks[week][playerId][gameId];
  const clearing = current === side;
  if(clearing){
    delete state.picks[week][playerId][gameId];
  } else {
    state.picks[week][playerId][gameId] = side;
  }
  render();
  const ok = await storageSet('picks-week-'+week+'-'+playerId+'-'+gameId, clearing ? null : side);
  if(!ok) flashBanner('Pick didn\'t save — check your connection and tap it again', true);
}

async function setLock(week, playerId, locked){
  if(!state.picks[week]) state.picks[week] = {};
  if(!state.picks[week][playerId]) state.picks[week][playerId] = {};
  state.picks[week][playerId]._locked = locked;
  render();
  const ok = await storageSet('picks-week-'+week+'-'+playerId+'-_locked', locked);
  if(!ok) flashBanner('Lock didn\'t save — check your connection and try again', true);
}

// Small fixed banner for surfacing a failed save -- otherwise a dropped write happens
// silently and just looks like the pick was never made.
function flashBanner(msg, isError){
  let el = document.getElementById('flashBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'flashBanner';
    el.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;'
      +'max-width:90%;padding:11px 18px;border-radius:6px;font-family:var(--f-condensed);'
      +'font-size:13px;font-weight:600;letter-spacing:0.03em;color:#fff;'
      +'box-shadow:0 4px 16px rgba(0,0,0,0.45);transition:opacity 0.2s;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = isError ? 'var(--accent)' : 'var(--win)';
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity='0'; }, 4000);
}

function computeStandings(){
  const totals = {};
  state.players.forEach(p=>{ totals[p.id] = {wins:0, losses:0}; });
  state.weeks.forEach(week=>{
    const games = state.games[week] || [];
    const picks = state.picks[week] || {};
    games.forEach(g=>{
      if(!g.winner) return;
      state.players.forEach(p=>{
        if(!totals[p.id]) totals[p.id] = {wins:0, losses:0};
        const pick = (picks[p.id]||{})[g.id];
        if(pick && pick===g.winner) totals[p.id].wins++;
        else totals[p.id].losses++;
      });
    });
  });
  return totals;
}

function render(){
  const main = document.getElementById('main');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===state.tab));
  if(!state.loaded){ main.innerHTML = '<div class="empty">Loading…</div>'; return; }
  if(state.tab==='picks') renderPicks(main);
  else if(state.tab==='standings') renderStandings(main);
  else renderAdmin(main);
}

const POSTSEASON_LABELS = {19:'Wild Card', 20:'Divisional', 21:'Conf. Champ.', 22:'Super Bowl'};
function weekLabel(week){
  return POSTSEASON_LABELS[week] || ('Week '+week);
}

function weekChipsHtml(activeWeek, prefix){
  return '<div class="weekrow">' + state.weeks.map(w=>
    '<button class="weekchip '+(w===activeWeek?'active':'')+'" data-'+prefix+'week="'+w+'">'+weekLabel(w)+'</button>'
  ).join('') + '</div>';
}

function renderPicks(main){
  if(state.weeks.length===0){ main.innerHTML = '<div class="empty">No weeks set up yet. Add one in Admin.</div>'; return; }
  const week = state.activeWeek;
  const games = (state.games[week]||[]).slice().sort((a,b)=> new Date(a.kickoff)-new Date(b.kickoff));
  const picks = state.picks[week] || {};
  const player = state.currentPlayerId;
  const myRecord = player ? picks[player] : null;
  // Default to locked for every week unless this player has explicitly unlocked it --
  // so each new week starts locked and they have to consciously flip it open.
  const playerLocked = player ? (myRecord && myRecord._locked === false ? false : true) : false;

  let html = weekChipsHtml(week, 'pk');

  if(games.length>0){
    const progress = state.players.map(p=>{
      const rec = picks[p.id] || {};
      const count = games.filter(g=> rec[g.id]).length;
      return {name:p.name, count, total:games.length};
    });
    const doneCount = progress.filter(p=>p.count===p.total).length;
    html += '<div class="progressrow"><div class="progresshead">'+doneCount+' of '+state.players.length+' have all picks in</div><div class="progresschips">'
      + progress.map(p=>{
          const st = p.count===p.total ? 'done' : (p.count>0 ? 'partial' : 'none');
          return '<span class="progresschip '+st+'">'+esc(p.name)+' '+p.count+'/'+p.total+'</span>';
        }).join('')
      + '</div></div>';
  }

  html += '<select class="whoami" id="whoami"><option value="">Who are you picking as?</option>' +
    state.players.map(p=>'<option value="'+p.id+'" '+(p.id===player?'selected':'')+'>'+esc(p.name)+'</option>').join('') +
    '</select>';

  if(player){
    html += '<div class="lockrow"><span class="locklabel">'+(playerLocked?'Picks locked':'Editing enabled')+'</span>'
      + '<label class="switch"><input type="checkbox" id="lockToggle" '+(playerLocked?'checked':'')+'><span class="sliderctl"></span></label></div>';
  }

  if(games.length===0){
    html += '<div class="empty">No games added for this week yet.</div>';
  } else {
    games.forEach(g=>{
      const kickLocked = isLocked(g);
      const disabled = kickLocked || !player || playerLocked;
      const remain = fmtLockRemaining(g.kickoff);
      const myPick = player ? (picks[player]||{})[g.id] : null;
      let statusHtml, statusClass;
      if(g.winner){ statusHtml = 'Final'; statusClass='final'; }
      else if(kickLocked){ statusHtml = 'Locked'; statusClass='locked'; }
      else { statusHtml = 'Locks in '+remain; statusClass='open'; }

      html += '<div class="card card-'+(g.winner?'final':(kickLocked?'locked':'open'))+'">';
      html += '<div class="card-top"><span class="kickoff">'+fmtKickoff(g.kickoff)+(g.tbd?' · time TBD':'')+(g.total?' · O/U '+esc(g.total):'')+'</span><span class="status '+statusClass+'">'+statusHtml+'</span></div>';
      html += '<div class="matchup">';
      ['away','home'].forEach(side=>{
        const name = g[side];
        const logo = teamLogoUrl(name);
        let cls = 'teambtn';
        if(myPick===side) cls += ' picked';
        if(g.winner===side) cls += ' winner';
        if(disabled) cls += ' disabled';
        html += '<button class="'+cls+'" data-pick="'+g.id+'|'+side+'" '+(disabled?'disabled':'')+'>'
          + (logo ? '<img class="teamlogo" src="'+logo+'" alt="" loading="lazy">' : '')
          + '<span class="at">'+(side==='away'?'Away':'Home')+'</span>'+esc(name)
          + (g.records ? '<span class="teamrecord">'+esc(g.records[side])+'</span>' : '')
          + (g.score ? '<span class="scoreline">'+g.score[side]+'</span>' : (g.spread ? '<span class="spreadline">'+esc(g.spread[side])+'</span>' : ''))
          + '</button>';
      });
      html += '</div>';

      if(kickLocked){
        const counts = {away:0, home:0};
        state.players.forEach(p=>{
          const pk = (picks[p.id]||{})[g.id];
          if(pk) counts[pk]++;
        });
        html += '<div class="subrow"><span>Away picks: '+counts.away+' · Home picks: '+counts.home+'</span>';
        if(g.winner && player){
          if(!myPick) html += '<span class="tag nopick">No pick — loss</span>';
          else if(myPick===g.winner) html += '<span class="tag correct">Correct</span>';
          else html += '<span class="tag incorrect">Incorrect</span>';
        }
        html += '</div>';
      }
      html += '</div>';
    });
  }
  main.innerHTML = html;

  main.querySelector('#whoami').addEventListener('change', e=>{
    state.currentPlayerId = e.target.value || null;
    render();
  });
  const lockToggle = main.querySelector('#lockToggle');
  if(lockToggle){
    lockToggle.addEventListener('change', e=>{ setLock(week, player, e.target.checked); });
  }
  main.querySelectorAll('[data-pkweek]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.activeWeek = parseInt(el.dataset.pkweek);
      loadWeek(state.activeWeek).then(()=>{
        render();
        syncWeekFromEspn(state.activeWeek).then(changed=>{ if(changed) render(); });
      });
    });
  });
  main.querySelectorAll('[data-pick]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [gameId, side] = el.dataset.pick.split('|');
      if(!state.currentPlayerId) return;
      setPick(week, state.currentPlayerId, gameId, side);
    });
  });
}

async function renderStandings(main){
  main.innerHTML = '<div class="empty">Loading…</div>';
  await ensureAllWeeksLoaded();
  const totals = computeStandings();
  const rows = state.players.map(p=>{
    const t = totals[p.id] || {wins:0, losses:0};
    const total = t.wins + t.losses;
    const pct = total>0 ? Math.round((t.wins/total)*100) : 0;
    return {name:p.name, wins:t.wins, losses:t.losses, pct};
  }).sort((a,b)=> b.wins-a.wins || a.losses-b.losses || a.name.localeCompare(b.name));

  let html = '<table class="standings"><thead><tr><th class="rank">#</th><th>Player</th><th class="rec">Record</th><th class="pct">Win %</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{
    html += '<tr><td class="rank">'+(i+1)+'</td><td class="pname">'+esc(r.name)+'</td><td class="rec">'+r.wins+'-'+r.losses+'</td><td class="pct">'+(r.wins+r.losses>0?r.pct+'%':'—')+'</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="hint" style="margin-top:14px;">Standings count every graded game across all weeks. A missed pick on a game that has started counts as a loss once the result is entered.</div>';
  main.innerHTML = html;
}

function renderAdmin(main){
  const week = state.adminWeek;
  let html = '';

  html += '<section class="admin-block"><h2>Players</h2>';
  html += '<div id="playersList">';
  state.players.forEach((p,i)=>{
    html += '<div class="prow"><input type="text" data-pidx="'+i+'" value="'+esc(p.name)+'"><button class="iconbtn" data-delplayer="'+i+'">×</button></div>';
  });
  html += '</div>';
  html += '<div class="btn-row"><button class="btn ghost" id="addPlayer">+ Add player</button><button class="btn" id="savePlayers">Save players</button><span class="saved-msg" id="playersSaved" style="display:none;">Saved</span></div>';
  html += '</section>';

  html += '<section class="admin-block"><h2>Weeks</h2>';
  html += '<div class="hint">All 18 weeks are pre-loaded with the real schedule. A few games late in the season (flex slots in weeks 16-18) weren\'t announced yet and aren\'t included — add them here once the matchups are set. Games marked "time TBD" have a placeholder kickoff; update the exact time as it\'s announced.</div>';
  html += weekChipsHtml(week, 'ad');
  html += '<div class="prow"><input type="text" id="newWeekNum" placeholder="Week number, e.g. '+(Math.max(0,...state.weeks)+1)+'" style="max-width:160px;"><button class="btn ghost" id="addWeek">+ Add week</button></div>';
  html += '</section>';

  if(week){
    const games = state.games[week] || [];
    html += '<section class="admin-block"><h2>'+weekLabel(week)+' games</h2>';
    if(week >= 19 && games.length===0){
      html += '<div class="hint">Matchups aren\'t set until the previous round wraps up. Try pulling from ESPN once the bracket updates, or add the games yourself below.</div>';
      html += '<div class="btn-row" style="margin-bottom:14px;"><button class="btn" id="pullPlayoff">Pull matchups from ESPN</button></div>';
    }
    html += '<div class="hint">Point spreads and winners fill in automatically — spreads update as the line moves, and winners fill in a few minutes after each game goes final. No need to enter either by hand.</div>';
    html += '<div class="btn-row" style="margin-bottom:14px;"><button class="btn ghost" id="checkScoresNow">Check spreads &amp; scores now</button><span class="saved-msg" id="scoresChecked" style="display:none;">Updated</span></div>';
    html += '<div id="gamesList">';
    games.forEach((g,i)=>{
      html += '<div class="grow" data-gidx="'+i+'">';
      html += '<div class="grow-fields">';
      html += '<input type="text" data-gfield="away" placeholder="Away team" value="'+esc(g.away)+'">';
      html += '<input type="text" data-gfield="home" placeholder="Home team" value="'+esc(g.home)+'">';
      html += '<input type="datetime-local" data-gfield="kickoff" value="'+toLocalInputValue(g.kickoff)+'">';
      html += '</div>';
      html += '<div class="grow-fields">';
      html += '<select data-gfield="winner"><option value="">Winner: none yet</option><option value="away" '+(g.winner==='away'?'selected':'')+'>Winner: away ('+esc(g.away||'')+')</option><option value="home" '+(g.winner==='home'?'selected':'')+'>Winner: home ('+esc(g.home||'')+')</option></select>';
      html += '<button class="iconbtn" data-delgame="'+i+'">Delete</button>';
      html += '</div></div>';
    });
    html += '</div>';
    html += '<div class="btn-row"><button class="btn ghost" id="addGame">+ Add game</button><button class="btn" id="saveGames">Save '+weekLabel(week)+'</button><span class="saved-msg" id="gamesSaved" style="display:none;">Saved</span></div>';
    html += '</section>';
  }

  main.innerHTML = html;

  main.querySelectorAll('[data-adweek]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.adminWeek = parseInt(el.dataset.adweek); loadWeek(state.adminWeek).then(render); });
  });

  main.querySelector('#addPlayer').addEventListener('click', ()=>{
    state.players.push({id:'p'+Date.now()+Math.floor(Math.random()*1000), name:'New player'});
    render();
  });
  main.querySelectorAll('[data-delplayer]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.players.splice(parseInt(el.dataset.delplayer),1);
      render();
    });
  });
  main.querySelector('#savePlayers').addEventListener('click', async ()=>{
    main.querySelectorAll('[data-pidx]').forEach(inp=>{
      state.players[parseInt(inp.dataset.pidx)].name = inp.value.trim() || 'Unnamed';
    });
    await storageSet('players', state.players, true);
    render();
    const s = document.getElementById('playersSaved'); if(s){ s.style.display='inline'; setTimeout(()=>s.style.display='none', 1500); }
  });

  main.querySelector('#addWeek').addEventListener('click', async ()=>{
    const input = document.getElementById('newWeekNum');
    const n = parseInt(input.value);
    if(!n || state.weeks.includes(n)) return;
    state.weeks.push(n);
    state.weeks.sort((a,b)=>a-b);
    state.games[n] = [];
    await storageSet('weeks', state.weeks, true);
    await storageSet('games-week-'+n, [], true);
    state.adminWeek = n;
    render();
  });

  if(week){
    const pullBtn = main.querySelector('#pullPlayoff');
    if(pullBtn){
      pullBtn.addEventListener('click', async (e)=>{
        e.target.disabled = true;
        e.target.textContent = 'Pulling…';
        await pullPlayoffMatchups(week);
        render();
      });
    }
    main.querySelector('#checkScoresNow').addEventListener('click', async (e)=>{
      e.target.disabled = true;
      e.target.textContent = 'Checking…';
      await syncWeekFromEspn(week);
      render();
      // re-grab after re-render since the old node is gone
      const s = document.getElementById('scoresChecked');
      if(s){ s.style.display='inline'; setTimeout(()=>s.style.display='none', 1500); }
    });
    main.querySelector('#addGame').addEventListener('click', ()=>{
      const games = state.games[week];
      games.push({id:'w'+week+'g'+(Date.now()), away:'', home:'', kickoff:new Date(Date.now()+3600000).toISOString(), winner:null});
      render();
    });
    main.querySelectorAll('[data-delgame]').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.games[week].splice(parseInt(el.dataset.delgame),1);
        render();
      });
    });
    main.querySelector('#saveGames').addEventListener('click', async ()=>{
      const rows = main.querySelectorAll('#gamesList > .grow');
      const updated = [];
      rows.forEach(row=>{
        const away = row.querySelector('[data-gfield=away]').value.trim();
        const home = row.querySelector('[data-gfield=home]').value.trim();
        const kickoffLocal = row.querySelector('[data-gfield=kickoff]').value;
        const winner = row.querySelector('[data-gfield=winner]').value || null;
        const existing = state.games[week][parseInt(row.dataset.gidx)] || {};
        updated.push({
          id: existing.id || ('w'+week+'g'+Date.now()+Math.floor(Math.random()*1000)),
          away, home,
          kickoff: kickoffLocal ? new Date(kickoffLocal).toISOString() : existing.kickoff,
          winner
        });
      });
      state.games[week] = updated;
      await storageSet('games-week-'+week, updated, true);
      render();
      const s = document.getElementById('gamesSaved'); if(s){ s.style.display='inline'; setTimeout(()=>s.style.display='none', 1500); }
    });
  }
}

function toLocalInputValue(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    state.tab = t.dataset.tab;
    if(state.tab==='admin' && !state.adminWeek) state.adminWeek = state.activeWeek;
    render();
  });
});

setInterval(()=>{ if(state.tab==='picks') render(); }, 30000);
setInterval(()=>{ syncStaleAndActiveWeeks(); }, 3*60*1000);

init().then(()=>{ syncStaleAndActiveWeeks(); });
</script>
